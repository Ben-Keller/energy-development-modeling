name: EDIM worker

on:
  workflow_run:
    workflows: ["EDIM check"]
    types: [completed]
  workflow_dispatch: {}

concurrency:
  group: edim-worker
  cancel-in-progress: false

env:
  RESOURCE_GROUP: undphq220rg03
  VM_NAME: undphq220vm001
  GIT_BRANCH: deploy

jobs:
  deploy-worker:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Check VM power state
        id: power
        run: |
          state="$(az vm get-instance-view -g "$RESOURCE_GROUP" -n "$VM_NAME" --query "instanceView.statuses[?starts_with(code, 'PowerState/')].displayStatus | [0]" -o tsv)"
          echo "state=$state" >> "$GITHUB_OUTPUT"
          echo "VM power state: $state"

      - name: Skip (VM not running)
        if: steps.power.outputs.state != 'VM running'
        run: echo "VM is '${{ steps.power.outputs.state }}' - leaving it off, nothing to do."

      - name: Rebuild worker image
        if: steps.power.outputs.state == 'VM running'
        run: |
          read -r -d '' SCRIPT <<EOF || true
          set -euo pipefail
          cd /opt/edim
          git fetch --all
          git checkout "$GIT_BRANCH"
          git pull --ff-only origin "$GIT_BRANCH"
          docker build -f worker/Dockerfile -t edim-worker:latest .
          systemctl restart edim-worker
          sleep 5
          systemctl --no-pager status edim-worker || true
          EOF
          payload="$(printf '%s' "$SCRIPT" | base64 -w0)"
          az vm run-command invoke -g "$RESOURCE_GROUP" -n "$VM_NAME" \
            --command-id RunShellScript \
            --scripts "echo '$payload' | base64 -d > /tmp/edim-update-image.sh && bash /tmp/edim-update-image.sh" \
            --query "value[0].message" -o tsv

      - name: Verify worker
        if: steps.power.outputs.state == 'VM running'
        run: |
          az vm run-command invoke -g "$RESOURCE_GROUP" -n "$VM_NAME" \
            --command-id RunShellScript \
            --scripts "systemctl --no-pager is-active edim-worker && docker ps --filter name=edim-worker --format '{{.Names}} {{.Status}}' && docker logs edim-worker --tail 20" \
            --query "value[0].message" -o tsv
