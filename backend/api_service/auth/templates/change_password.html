{% extends "base.html" %}

{% block title %}Change password · EDIM{% endblock %}
{% block heading %}Change password{% endblock %}

{% block content %}
<form method="post" action="/auth/change-password">
  <div class="mb-3">
    <label class="form-label" for="current">Current password</label>
    <input
      class="form-control"
      id="current"
      name="current"
      type="password"
      autocomplete="current-password"
      required
      autofocus
    />
  </div>

  <div class="mb-3">
    <label class="form-label" for="new">New password</label>
    <input
      class="form-control"
      id="new"
      name="new"
      type="password"
      autocomplete="new-password"
      required
    />
  </div>

  <div class="mb-3">
    <label class="form-label" for="confirm">Confirm new password</label>
    <input
      class="form-control"
      id="confirm"
      name="confirm"
      type="password"
      autocomplete="new-password"
      required
    />
  </div>

  <button class="btn btn-edim w-100" type="submit">Update password</button>
</form>
{% endblock %}

{% block footer %}
<div class="edim-foot">
  <a href="/ui/">Back to the workspace</a>
  <a href="/auth/logout">Sign out</a>
</div>
{% endblock %}
