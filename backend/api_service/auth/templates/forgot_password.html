{% extends "base.html" %}

{% block title %}Reset your password · EDIM{% endblock %}
{% block heading %}Reset your password{% endblock %}

{% block content %}
<form method="post" action="/auth/forgot-password">
  <div class="mb-3">
    <label class="form-label" for="email">E-mail</label>
    <input
      class="form-control"
      id="email"
      name="email"
      type="email"
      value="{{ email }}"
      autocomplete="username"
      required
      autofocus
    />
  </div>

  <button class="btn btn-edim w-100" type="submit">Request reset link</button>
</form>

{% if reset_link %}
<code class="edim-token">{{ reset_link }}</code>
{% endif %}
{% endblock %}
