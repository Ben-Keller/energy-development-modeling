{% extends "base.html" %}

{% block title %}Choose a new password · EDIM{% endblock %}
{% block heading %}Choose a new password{% endblock %}

{% block content %}
<form method="post" action="/auth/reset-password">
  <input type="hidden" name="token" value="{{ token }}" />

  <div class="mb-3">
    <label class="form-label" for="password">New password</label>
    <input
      class="form-control"
      id="password"
      name="password"
      type="password"
      autocomplete="new-password"
      required
      autofocus
    />
  </div>

  <div class="mb-3">
    <label class="form-label" for="confirm">Confirm new password</label>
    <input
      class="form-control"
      id="confirm"
      name="confirm"
      type="password"
      autocomplete="new-password"
      required
    />
  </div>

  <button class="btn btn-edim w-100" type="submit">Set new password</button>
</form>
{% endblock %}
