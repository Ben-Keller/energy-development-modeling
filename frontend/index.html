<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EDIM – Integrated Energy-Development Workbench</title>
    <link rel="icon" href="./assets/undp-logo.svg?v=edim" type="image/svg+xml" />
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      crossorigin=""
    />
    <link rel="stylesheet" href="./methodology/methodology.css" />
    <style>
      :root {
        color-scheme: dark;
        --edim-header-height: 76px;
        --edim-header-logo-size: 76px;
        --edim-header-brand-gap: 6px;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: "IBM Plex Sans", "Segoe UI", sans-serif;
        background:
          radial-gradient(1200px 600px at 10% -20%, #1a2f56 0%, rgba(26, 47, 86, 0) 60%),
          radial-gradient(900px 520px at 100% -25%, #1d3b66 0%, rgba(29, 59, 102, 0) 62%),
          #070d17;
        color: #e6edf7;
        min-height: 100vh;
        overflow: hidden;
      }

      html,
      body,
      #root {
        height: 100%;
      }

      a {
        color: #86b9ff;
        text-decoration: none;
        cursor: pointer;
      }

      a:hover {
        text-decoration: underline;
      }

      .container {
        max-width: 1320px;
        margin: 0 auto;
        padding: 24px 18px 40px;
      }

      .app-shell {
        height: 100%;
        display: grid;
        grid-template-rows: auto auto minmax(0, 1fr);
        overflow: hidden;
      }

      .landing-shell {
        min-height: 100%;
        height: 100%;
        overflow: auto;
        display: grid;
        grid-template-rows: auto minmax(0, 1fr) auto;
        background:
          linear-gradient(180deg, rgba(4, 11, 22, 0.96) 0%, rgba(7, 13, 23, 0.98) 58%, rgba(9, 16, 28, 1) 100%),
          radial-gradient(900px 520px at 18% 6%, rgba(46, 111, 201, 0.22) 0%, rgba(46, 111, 201, 0) 62%),
          radial-gradient(720px 520px at 88% 16%, rgba(39, 161, 139, 0.14) 0%, rgba(39, 161, 139, 0) 66%);
      }

      .edim-topbar {
        position: relative;
        z-index: 300;
        height: var(--edim-header-height);
        min-height: var(--edim-header-height);
        box-sizing: border-box;
        display: grid;
        grid-template-columns: minmax(260px, auto) minmax(0, 1fr) auto;
        align-items: center;
        gap: 20px;
        padding: 0 24px 0 0;
        border-bottom: 1px solid rgba(87, 115, 158, 0.24);
        background:
          linear-gradient(180deg, rgba(8, 14, 24, 0.96) 0%, rgba(8, 14, 24, 0.84) 100%);
        backdrop-filter: blur(18px);
      }

      .edim-brand {
        display: inline-flex;
        align-items: center;
        gap: var(--edim-header-brand-gap);
        min-width: 0;
        border: 0;
        background: transparent;
        color: #f8fbff;
        cursor: default;
        font-family: inherit;
        padding: 0;
        text-align: left;
      }

      .edim-brand-copy {
        min-width: 0;
        display: inline-flex;
        flex-direction: column;
        gap: 2px;
        line-height: 1;
      }

      .edim-logo {
        width: var(--edim-header-logo-size);
        height: var(--edim-header-logo-size);
        object-fit: contain;
        display: block;
        flex: 0 0 auto;
      }

      .edim-brand-copy small {
        display: block;
        color: #8ea4c5;
        font-size: 10px;
        font-weight: 900;
        letter-spacing: 0.12em;
        line-height: 1.1;
        text-transform: uppercase;
      }

      .edim-brand-copy strong {
        display: block;
        color: #f8fbff;
        font-size: 18px;
        line-height: 1.05;
        font-weight: 850;
        letter-spacing: -0.03em;
      }

      .landing-main {
        width: 100%;
        margin: 0;
        padding: 0;
        display: grid;
        gap: 0;
        align-content: start;
      }

      .landing-hero-section {
        position: relative;
        min-height: calc(100vh - var(--edim-header-height));
        height: calc(100vh - var(--edim-header-height));
        display: block;
        overflow: hidden;
        padding: 0;
        isolation: isolate;
        background:
          radial-gradient(900px 540px at 16% 16%, rgba(37, 99, 235, 0.2), transparent 68%),
          radial-gradient(820px 520px at 82% 36%, rgba(20, 184, 166, 0.16), transparent 72%),
          linear-gradient(180deg, rgba(5, 12, 23, 0.94), rgba(7, 13, 23, 0.98));
      }

      .landing-hero-card {
        position: relative;
        z-index: 3;
        width: min(880px, calc(100% - clamp(64px, 16vw, 220px)));
        min-height: 100%;
        margin: 0 0 0 clamp(32px, 7vw, 112px);
        padding: clamp(68px, 9vw, 118px) 0 clamp(56px, 8vw, 88px);
        display: grid;
        align-content: center;
      }

      .landing-hero-visual-slot {
        position: absolute;
        inset: -8%;
        z-index: 1;
        overflow: hidden;
        pointer-events: none;
      }

      .landing-hero-d3-root {
        position: absolute;
        inset: 0;
        z-index: 2;
        width: 100%;
        height: 100%;
        min-height: calc(100vh - var(--edim-header-height));
        opacity: 1;
        transform: scale(1.03);
        transform-origin: center;
        background:
          radial-gradient(900px 520px at 18% 12%, rgba(37, 99, 235, 0.24), transparent 64%),
          radial-gradient(720px 460px at 86% 24%, rgba(20, 184, 166, 0.18), transparent 70%);
      }

      .landing-hero-scrim {
        position: absolute;
        inset: 0;
        z-index: 2;
        pointer-events: none;
        background:
          radial-gradient(760px 520px at 24% 52%, rgba(5, 12, 23, 0.92) 0%, rgba(5, 12, 23, 0.72) 42%, rgba(5, 12, 23, 0.18) 72%, rgba(5, 12, 23, 0) 100%),
          linear-gradient(90deg, rgba(5, 12, 23, 0.97) 0%, rgba(7, 13, 23, 0.92) 34%, rgba(7, 13, 23, 0.62) 58%, rgba(7, 13, 23, 0.18) 100%),
          radial-gradient(620px 360px at 18% 48%, rgba(30, 64, 175, 0.2), rgba(7, 13, 23, 0));
      }

      .landing-hero-flashlight {
        position: absolute;
        inset: 0;
        z-index: 2;
        pointer-events: none;
        opacity: var(--landing-hero-flashlight-opacity, 0);
        background:
          linear-gradient(90deg, rgba(5, 12, 23, 0.72) 0%, rgba(5, 12, 23, 0.5) 28%, rgba(5, 12, 23, 0.08) 52%, rgba(5, 12, 23, 0) 72%),
          radial-gradient(
            500px 390px at var(--landing-hero-flashlight-x, 50%) var(--landing-hero-flashlight-y, 50%),
            rgba(251, 113, 133, 0.16) 0%,
            rgba(245, 158, 11, 0.085) 34%,
            rgba(56, 189, 248, 0.04) 62%,
            rgba(7, 13, 23, 0) 82%
          );
        mix-blend-mode: screen;
        transition: opacity 160ms ease;
      }

      .landing-hero-card h1 {
        max-width: 800px;
        margin: 0;
        color: #f8fbff;
        font-size: clamp(46px, 8vw, 88px);
        line-height: 0.92;
        letter-spacing: -0.065em;
      }

      .landing-hero-card p {
        max-width: 740px;
        margin: 22px 0 0;
        color: rgba(219, 234, 254, 0.82);
        font-size: clamp(16px, 2vw, 20px);
        line-height: 1.58;
      }

      .landing-actions {
        display: flex;
        align-items: center;
        gap: 14px;
        flex-wrap: wrap;
        margin-top: 32px;
      }

      .landing-primary-action {
        padding: 12px 18px;
        border-radius: 999px;
        background: linear-gradient(135deg, #2563eb 0%, #0ea5e9 100%);
        border: 1px solid rgba(191, 219, 254, 0.42);
        box-shadow: 0 16px 34px rgba(37, 99, 235, 0.28);
        font-size: 14px;
        font-weight: 900;
      }

      .landing-secondary-action {
        padding: 11px 15px;
        border-radius: 999px;
        border: 1px solid rgba(191, 219, 254, 0.24);
        background: rgba(8, 18, 34, 0.58);
        color: #dbeafe;
        font-size: 13px;
        font-weight: 900;
      }

      .landing-secondary-action:hover {
        border-color: rgba(125, 211, 252, 0.46);
        background: rgba(14, 165, 233, 0.16);
      }

      .landing-session-note {
        color: #9fb3cc;
        font-size: 13px;
      }

      .landing-message {
        max-width: 760px;
      }

      .landing-video-section,
      .landing-feature-section {
        width: min(1180px, calc(100vw - 36px));
        margin: 0 auto;
        padding: clamp(54px, 8vw, 92px) 0;
      }

      .landing-video-section {
        display: grid;
        grid-template-columns: minmax(260px, 0.78fr) minmax(360px, 1.22fr);
        gap: clamp(24px, 5vw, 58px);
        align-items: center;
        border-top: 1px solid rgba(123, 158, 212, 0.16);
      }

      .landing-section-heading {
        max-width: 540px;
      }

      .landing-section-heading.compact {
        max-width: 760px;
        margin-bottom: 20px;
      }

      .landing-section-kicker {
        color: #67e8f9;
        font-size: 11px;
        font-weight: 900;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }

      .landing-section-heading h2 {
        margin: 10px 0 0;
        color: #f8fbff;
        font-size: clamp(30px, 4vw, 50px);
        line-height: 0.98;
        letter-spacing: -0.045em;
      }

      .landing-section-heading p {
        margin: 16px 0 0;
        color: #a9bad0;
        font-size: 15px;
        line-height: 1.65;
      }

      .landing-video-frame {
        position: relative;
        min-height: 360px;
        overflow: hidden;
        border: 1px solid rgba(123, 158, 212, 0.24);
        border-radius: 32px;
        background:
          linear-gradient(135deg, rgba(15, 23, 42, 0.96), rgba(8, 15, 27, 0.98)),
          radial-gradient(520px 260px at 70% 18%, rgba(14, 165, 233, 0.22), transparent 66%);
        box-shadow: 0 30px 90px rgba(0, 0, 0, 0.34);
      }

      .landing-video-frame video {
        width: 100%;
        height: 100%;
        min-height: 360px;
        display: block;
        object-fit: cover;
        background: #020617;
      }

      .landing-video-placeholder {
        min-height: 360px;
        display: grid;
        grid-template-columns: auto minmax(0, 1fr);
        gap: 18px;
        align-items: end;
        padding: 28px;
        background:
          linear-gradient(135deg, rgba(2, 6, 23, 0.08), rgba(2, 6, 23, 0.56)),
          repeating-linear-gradient(120deg, rgba(148, 163, 184, 0.08) 0 1px, transparent 1px 28px),
          radial-gradient(260px 180px at 74% 22%, rgba(45, 212, 191, 0.26), transparent 72%),
          radial-gradient(420px 260px at 18% 80%, rgba(37, 99, 235, 0.26), transparent 68%);
      }

      .landing-video-play {
        width: 64px;
        height: 64px;
        display: grid;
        place-items: center;
        border-radius: 999px;
        border: 1px solid rgba(191, 219, 254, 0.46);
        background: rgba(37, 99, 235, 0.72);
        color: #f8fbff;
        box-shadow: 0 18px 46px rgba(37, 99, 235, 0.28);
      }

      .landing-video-title {
        color: #f8fbff;
        font-size: 18px;
        font-weight: 900;
      }

      .landing-video-copy {
        max-width: 520px;
        margin-top: 7px;
        color: #a9bad0;
        font-size: 13px;
        line-height: 1.5;
      }

      .landing-feature-grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 16px;
      }

      .landing-feature-card {
        overflow: hidden;
        padding: 0;
        border: 1px solid rgba(123, 158, 212, 0.22);
        border-radius: 26px;
        background:
          linear-gradient(180deg, rgba(15, 26, 45, 0.88) 0%, rgba(9, 17, 31, 0.9) 100%);
        box-shadow: 0 22px 60px rgba(0, 0, 0, 0.28);
      }

      .landing-feature-card h3 {
        margin: 18px 18px 0;
        color: #f8fbff;
        font-size: 18px;
      }

      .landing-feature-card p {
        margin: 8px 18px 20px;
        color: #a9bad0;
        font-size: 13px;
        line-height: 1.5;
      }

      .landing-card-visual {
        height: 168px;
        display: grid;
        place-items: center;
        background:
          radial-gradient(220px 120px at 22% 18%, rgba(34, 211, 238, 0.22), transparent 68%),
          radial-gradient(210px 130px at 82% 72%, rgba(245, 158, 11, 0.14), transparent 70%),
          linear-gradient(135deg, rgba(7, 20, 38, 0.98), rgba(13, 31, 49, 0.96));
        border-bottom: 1px solid rgba(123, 158, 212, 0.2);
      }

      .landing-card-visual svg {
        width: 86%;
        height: 82%;
      }

      .landing-card-visual path,
      .landing-card-visual line,
      .landing-card-visual polygon,
      .landing-card-visual rect {
        fill: rgba(37, 99, 235, 0.14);
        stroke: rgba(125, 211, 252, 0.76);
        stroke-width: 3;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      .landing-card-visual circle {
        fill: rgba(34, 197, 94, 0.2);
        stroke: rgba(187, 247, 208, 0.78);
        stroke-width: 3;
      }

      .landing-card-visual.evidence rect {
        fill: rgba(245, 158, 11, 0.18);
        stroke: rgba(253, 230, 138, 0.78);
      }

      .landing-footer {
        min-height: 96px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 18px;
        flex-wrap: wrap;
        padding: 24px 18px;
        border-top: 1px solid rgba(123, 158, 212, 0.18);
        background: rgba(2, 6, 23, 0.54);
        color: #8ea4c5;
        font-size: 12px;
      }

      .landing-footer div:first-child {
        color: #f8fbff;
        font-weight: 900;
      }

      .brand-home-button {
        padding: 0;
        border: 0;
        border-radius: 0;
        background: transparent;
        color: inherit;
        font-family: inherit;
        line-height: 1;
        text-align: left;
      }

      .brand-home-button:hover:enabled,
      .brand-home-button:focus-visible {
        filter: none;
      }

      .brand-home-button:focus-visible {
        outline: 1px solid rgba(103, 232, 249, 0.7);
        outline-offset: -4px;
      }

      .header-project-area {
        min-width: 0;
        display: grid;
        grid-template-columns: 1fr auto 1fr;
        align-items: center;
        gap: 6px;
        text-align: center;
      }

      .header-project-area.in-project {
        gap: 28px;
      }

      .header-project-title {
        max-width: 100%;
        color: #e6f0ff;
        font-size: 24px;
        font-weight: 900;
        line-height: 1.1;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        grid-column: 2;
      }

      .header-back-button {
        grid-column: 3;
        justify-self: start;
        flex: 0 0 auto;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 6px 9px;
        border-radius: 999px;
        background: rgba(18, 30, 50, 0.42);
        color: #cfe2ff;
        border-color: rgba(130, 159, 204, 0.2);
        font-size: 12px;
        opacity: 0.72;
      }

      .header-back-button:hover {
        opacity: 0.9;
      }

      .header-user-select {
        justify-self: end;
        min-width: 0;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 0;
        border: 0;
        border-radius: 0;
        background: transparent;
      }

      .header-user-select span {
        font-size: 10px;
        font-weight: 900;
        letter-spacing: 0.09em;
        text-transform: uppercase;
        color: #8ea4c5;
      }

      .header-user-select select {
        max-width: 180px;
      }

      .header-right-controls {
        justify-self: end;
        min-width: 0;
        display: flex;
        align-items: center;
        justify-content: flex-end;
        gap: 20px;
      }

      .runtime-target-control {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 0;
        min-height: 24px;
        overflow: visible;
      }

      .runtime-target-row {
        display: inline-flex;
        align-items: center;
        justify-content: flex-end;
        gap: 10px;
        height: 24px;
        overflow: visible;
        white-space: nowrap;
      }

      .runtime-target-label,
      .runtime-switch-label {
        display: inline-flex;
        align-items: center;
        height: 18px;
        margin: 0;
        padding: 0;
        font-size: 10px;
        font-weight: 900;
        letter-spacing: 0.09em;
        line-height: 18px;
        text-transform: uppercase;
        color: #8ea4c5;
      }

      .runtime-switch-label.is-active {
        color: #f8fbff;
      }

      .runtime-switch-control {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        height: 24px;
        margin: 0;
        padding: 0;
        cursor: pointer;
        user-select: none;
      }

      .runtime-toggle-shell {
        position: relative;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 36px;
        height: 18px;
        flex: 0 0 36px;
      }

      .runtime-toggle-input {
        position: absolute;
        inset: 0;
        width: 36px;
        height: 18px;
        margin: 0;
        opacity: 0;
        pointer-events: none;
      }

      .runtime-toggle-track {
        position: relative;
        display: block;
        width: 36px;
        height: 18px;
        box-sizing: border-box;
        border: 1px solid rgba(130, 159, 204, 0.34);
        border-radius: 999px;
        background: rgba(18, 30, 50, 0.9);
        transition: background 160ms ease, border-color 160ms ease;
      }

      .runtime-toggle-thumb {
        position: absolute;
        left: 2px;
        top: 1px;
        width: 14px;
        height: 14px;
        border-radius: 999px;
        background: #8fb9ff;
        box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.24), 0 4px 10px rgba(0, 0, 0, 0.4);
        transition: transform 160ms ease, background 160ms ease;
      }

      .runtime-toggle-input:checked + .runtime-toggle-track {
        border-color: rgba(245, 158, 11, 0.7);
        background: rgba(245, 158, 11, 0.22);
      }

      .runtime-toggle-input:checked + .runtime-toggle-track .runtime-toggle-thumb {
        transform: translateX(18px);
        background: #fb923c;
      }

      .runtime-info-slot {
        position: relative;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 20px;
        height: 24px;
        flex: 0 0 20px;
        overflow: visible;
        z-index: 360;
      }

      button.runtime-info-button {
        all: unset;
        box-sizing: border-box;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 18px;
        height: 18px;
        min-width: 18px;
        min-height: 18px;
        max-width: 18px;
        max-height: 18px;
        margin: 0;
        padding: 0;
        border: 1px solid rgba(130, 159, 204, 0.4);
        border-radius: 999px;
        background: rgba(18, 30, 50, 0.9);
        color: #d9e9ff;
        font-family: "IBM Plex Sans", sans-serif;
        font-size: 11px;
        font-weight: 950;
        line-height: 18px;
        text-align: center;
        cursor: help;
      }

      button.runtime-info-button.ok {
        border-color: rgba(74, 222, 128, 0.42);
        color: #bbf7d0;
      }

      button.runtime-info-button.warning,
      button.runtime-info-button.checking {
        border-color: rgba(251, 191, 36, 0.46);
        color: #fde68a;
      }

      button.runtime-info-button.error {
        border-color: rgba(248, 113, 113, 0.48);
        color: #fecaca;
      }

      button.runtime-info-button:hover:enabled {
        filter: none;
      }

      .runtime-info-panel {
        position: absolute;
        z-index: 1000;
        right: 0;
        top: calc(100% + 8px);
        width: min(320px, 78vw);
        display: grid;
        gap: 6px;
        padding: 10px 12px;
        border: 1px solid rgba(130, 159, 204, 0.34);
        border-radius: 12px;
        background: #07101e;
        box-shadow: 0 18px 40px rgba(0, 0, 0, 0.48);
        color: #dcecff;
        font-size: 11px;
        line-height: 1.35;
        opacity: 0;
        pointer-events: none;
        transform: translateY(-4px);
        transition: opacity 140ms ease, transform 140ms ease;
      }

      .runtime-info-panel b {
        color: #8ea4c5;
      }

      .runtime-info-slot:hover .runtime-info-panel,
      .runtime-info-slot:focus-within .runtime-info-panel {
        opacity: 1;
        transform: translateY(0);
      }

      .header-grid {
        display: grid;
        grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr);
        gap: 16px;
        align-items: start;
      }

      .header-title {
        font-family: "IBM Plex Sans Condensed", "IBM Plex Sans", sans-serif;
        font-size: 28px;
        font-weight: 700;
        letter-spacing: 0.01em;
        margin: 0;
      }

      .header-kpi-strip {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
      }

      .header-kpi {
        min-width: 122px;
        padding: 10px 12px;
        border-radius: 12px;
        border: 1px solid #22324f;
        background: linear-gradient(180deg, rgba(18, 28, 46, 0.9) 0%, rgba(10, 17, 28, 0.92) 100%);
      }

      .header-kpi-value {
        margin-top: 4px;
        font-size: 15px;
        font-weight: 700;
      }

      .app-body {
        min-height: 0;
        display: grid;
        grid-template-columns: 336px minmax(0, 1fr) 340px;
        gap: 14px;
        padding: 14px 16px 16px;
        overflow: hidden;
      }

      .global-run-tab-bar {
        min-width: 0;
        padding: 0 18px;
        border-bottom: 1px solid rgba(42, 58, 88, 0.72);
        background: rgba(6, 12, 22, 0.86);
      }

      .global-run-tab-bar.empty {
        height: 0;
        padding: 0;
        border: 0;
        overflow: hidden;
      }

      .global-run-tab-bar .run-tab-strip {
        width: 100%;

        .project-home-hero-card,
        .project-comparison-header {
          grid-template-columns: 1fr;
        }

        .project-home-stats {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }

        .project-summary-panel {
          grid-template-columns: 1fr;
        }

        .project-summary-panel > .run-management-eyebrow,
        .project-summary-panel > h2,
        .project-summary-panel > .muted,
        .project-summary-panel > .project-info-stat-grid,
        .project-summary-panel > .project-info-section {
          grid-column: 1;
          grid-row: auto;
        }

        .scenario-readonly-grid,
        .scenario-readonly-grid.lever-grid {
          grid-template-columns: 1fr;
        }

        .topbar-diagnostics-panel {
          max-height: none;
        }

        .results-settings-panel,
        .results-mode-main,
        .flow-model-shell,
        .d3-architecture-core {
          overflow: visible;
        }

        .flow-model-shell {
          min-height: 980px;
        }

        .flow-model-toolbar {
          align-items: flex-start;
          flex-direction: column;
        }

        .flow-model-viewport {
          overflow: auto;
        }

        .diagram-node-grid,
        .diagram-control-grid,
        .diagram-lever-grid {
          grid-template-columns: 1fr;
        }

        .flow-node.node-scenario .diagram-control-grid,
        .flow-node.node-scenario .diagram-lever-grid,
        .diagram-scenario-layout {
          grid-template-columns: 1fr;
        }

        .d3-architecture-core {
          height: auto;
          min-height: 1120px;
        }

        .d3-architecture-control-layer {
          position: relative;
          inset: auto;
        }

        .d3-architecture-frame {
          position: absolute;
          min-height: 1120px;
          opacity: 0.55;
        }

        .d3-overlay-grid {
          position: relative;
          z-index: 2;
          grid-template-columns: 1fr;
          grid-template-rows: auto;
          grid-template-areas:
            "scenario"
            "calliope"
            "mrio"
            "outputs"
            "operations";
        }

        .d3-overlay-panel {
          max-height: none;
        }

        .dashboard-rail,
        .dashboard-main {
          overflow: visible;
        }

        .dashboard-pane-scroll,
        .analysis-section-body {
          overflow: visible;
          max-height: none;
        }

        .workspace-map-grid,
        .dashboard-hero,
        .dashboard-empty-hero,
        .header-grid {
          grid-template-columns: 1fr;
        }
      }

      @media (max-width: 980px) {
        .app-body {
          padding: 12px;
        }

        .grid {
          grid-template-columns: 1fr !important;
        }

        .hbar-row {
          grid-template-columns: 1fr;
          gap: 4px;
        }
      }
    </style>
  </head>
